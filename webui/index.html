<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server WebUI</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 配置 Tailwind 支持 class 模式的暗色切换
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        /* 平滑过渡 */
        body { transition: background-color 0.3s, color 0.3s; }
        .card-transition { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-200 font-sans">
    <div id="app" class="max-w-6xl mx-auto p-6">
        
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight">控制面板</h1>
            
            <button @click="toggleDarkMode" 
                    class="p-2 rounded-lg bg-white dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                <svg v-if="isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 18v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <svg v-else xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-6">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow card-transition border border-transparent dark:border-gray-700">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-bold">服务器状态</h2>
                        <span :class="isRunning ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'" 
                              class="px-3 py-1 rounded-full text-sm font-semibold">
                            {{ isRunning ? '运行中' : '已停止' }}
                        </span>
                    </div>
                    <div class="mt-6 flex space-x-4">
                        <button @click="startServer" :disabled="isRunning" 
                                class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50 transition shadow-lg shadow-indigo-500/30">
                            启动
                        </button>
                        <button @click="stopServer" :disabled="!isRunning" 
                                class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded disabled:opacity-50 transition shadow-lg shadow-red-500/30">
                            停止
                        </button>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow card-transition border border-transparent dark:border-gray-700">
                    <h2 class="text-xl font-bold mb-4">核心配置</h2>
                    <form @submit.prevent="saveConfig" class="space-y-4">
                        <div v-for="item in schema" :key="item.key" class="flex flex-col">
                            <label class="text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">
                                {{ item.label }}
                            </label>
                            <input v-if="item.type === 'string'" type="text" v-model="config[item.key]" 
                                   class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none transition-all dark:text-white">
                            <input v-else-if="item.type === 'number'" type="number" :step="item.step || 1" v-model.number="config[item.key]" 
                                   class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none transition-all dark:text-white">
                        </div>
                        <button type="submit" 
                                class="w-full mt-4 bg-gray-800 dark:bg-indigo-600 hover:bg-gray-900 dark:hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition">
                            保存配置
                        </button>
                        <p v-if="saveMessage" class="text-center text-sm text-green-600 dark:text-green-400 mt-2 font-medium">{{ saveMessage }}</p>
                    </form>
                </div>
            </div>

            <div class="bg-gray-900 rounded-xl shadow-2xl flex flex-col h-[750px] border border-gray-800">
                <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        <span class="ml-2 text-sm font-mono text-gray-400">Terminal Log</span>
                    </div>
                    <button @click="logs = []" class="text-xs text-gray-500 hover:text-white transition">Clear</button>
                </div>
                <div class="p-4 flex-1 overflow-y-auto font-mono text-sm text-green-400 space-y-1 scrollbar-thin scrollbar-thumb-gray-700" id="log-container">
                    <div v-for="(log, idx) in logs" :key="idx" class="opacity-90">
                        <span class="text-gray-500">>></span> {{ log }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick, watch } = Vue;

        createApp({
            setup() {
                const schema = ref([]);
                const config = ref({});
                const isRunning = ref(false);
                const logs = ref([]);
                const saveMessage = ref('');
                const isDarkMode = ref(localStorage.getItem('theme') === 'dark');

                // 暗色模式逻辑
                const toggleDarkMode = () => {
                    isDarkMode.value = !isDarkMode.value;
                    applyTheme();
                };

                const applyTheme = () => {
                    if (isDarkMode.value) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                    }
                };

                const fetchSchemaAndConfig = async () => {
                    try {
                        const [sRes, cRes] = await Promise.all([
                            fetch('/api/schema'),
                            fetch('/api/config')
                        ]);
                        schema.value = await sRes.json();
                        config.value = await cRes.json();
                    } catch (e) { console.error("Failed to load config", e); }
                };

                const checkStatus = async () => {
                    try {
                        const res = await fetch('/api/status');
                        const data = await res.json();
                        isRunning.value = data.running;
                    } catch (e) { isRunning.value = false; }
                };

                const saveConfig = async () => {
                    await fetch('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ config: config.value })
                    });
                    saveMessage.value = '✓ 配置保存成功';
                    setTimeout(() => saveMessage.value = '', 3000);
                };

                const startServer = async () => {
                    await fetch('/api/start', { method: 'POST' });
                    checkStatus();
                };

                const stopServer = async () => {
                    await fetch('/api/stop', { method: 'POST' });
                    checkStatus();
                };

                const connectLogWebSocket = () => {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const ws = new WebSocket(`${protocol}//${window.location.host}/ws/logs`);
                    ws.onmessage = (event) => {
                        logs.value.push(event.data);
                        if (logs.value.length > 300) logs.value.shift();
                        nextTick(() => {
                            const container = document.getElementById('log-container');
                            if (container) container.scrollTop = container.scrollHeight;
                        });
                    };
                    ws.onclose = () => setTimeout(connectLogWebSocket, 2000);
                };

                onMounted(() => {
                    applyTheme();
                    fetchSchemaAndConfig();
                    checkStatus();
                    setInterval(checkStatus, 3000);
                    connectLogWebSocket();
                });

                return { 
                    schema, config, isRunning, logs, saveMessage, 
                    isDarkMode, toggleDarkMode,
                    saveConfig, startServer, stopServer 
                };
            }
        }).mount('#app');
    </script>

    <style>
        /* 自定义滚动条样式 */
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1a1a1a; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</body>
</html>
